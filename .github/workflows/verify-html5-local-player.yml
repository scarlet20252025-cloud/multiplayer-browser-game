name: Verify local two-tab HTML5 game launch

on:
  push:
    branches: ['work/flash-netplay-lab']
    paths:
      - 'scripts/start-html5-local-room.mjs'
      - 'scripts/html5-local-player.mjs'
      - 'scripts/verify-html5-local-player.mjs'
      - 'scripts/html5-research-host.mjs'
      - 'server/html5-research-room.mjs'
      - 'adapters/fireboy-html5/spectator-*.mjs'
      - '.github/workflows/verify-html5-local-player.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  local-player:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out authored project
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Node.js 24
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          cache: npm
      - name: Install locked project dependencies
        run: npm ci
      - name: Run authored regression tests
        run: npm test
      - name: Install Chromium
        run: npx playwright install --with-deps chromium-headless-shell
      - name: Fetch pinned research candidate into ignored folder
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: 1224HuangJin/Fireboy-and-Watergirl
          ref: 8568034556f567b5c429c0223dc1bf6dd2409277
          path: local/html5-candidate
          sparse-checkout: output/A
          persist-credentials: false
      - name: Launch one real authority and join with two ordinary game tabs
        run: >-
          node scripts/verify-html5-local-player.mjs
          --root local/html5-candidate/output/A
          --script js/init.eb02fbdab2aa1d24.js
          --expected-sha256 337125629748bace45e23b040e54b0d206e4cd78c9c8709d7785faa637e00677
          --out local/html5-local-player-results
      - name: Preserve generated JSON only
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: local-player-\${{ github.run_id }}
          path: local/html5-local-player-results/*.json
          retention-days: 14
          if-no-files-found: warn
