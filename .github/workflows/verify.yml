name: Verify multiplayer lab

on:
  push:
    branches: ['**']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    defaults:
      run:
        shell: bash
    env:
      CI: 'true'
    steps:
      - name: Check out repository
        # Official tag: https://github.com/actions/checkout/releases/tag/v7.0.1
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js 24
        # Official tag: https://github.com/actions/setup-node/releases/tag/v7.1.0
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          cache: npm

      - name: Prepare evidence directories
        run: mkdir -p evidence local/screenshots

      - name: Install locked dependencies
        run: npm ci

      - name: Run protocol and server tests
        run: npm test 2>&1 | tee evidence/unit-tests.log

      - name: Run Python tests
        run: npm run test:python 2>&1 | tee evidence/python-tests.log

      - name: Check repository text encoding
        run: npm run check:utf8 2>&1 | tee evidence/utf8-check.log

      - name: Install Playwright browser and system dependencies
        id: browser
        run: npx playwright install --with-deps chromium-headless-shell 2>&1 | tee evidence/browser-install.log

      - name: Run three-instance AS3 browser verification
        if: ${{ !cancelled() && steps.browser.outcome == 'success' }}
        run: npm run test:e2e 2>&1 | tee evidence/e2e-console.log

      - name: Run network impairment verification
        if: ${{ !cancelled() && steps.browser.outcome == 'success' }}
        run: npm run test:network 2>&1 | tee evidence/network-console.log

      - name: Upload verification evidence and probe screenshots
        if: ${{ always() }}
        # Official tag: https://github.com/actions/upload-artifact/releases/tag/v7.0.2
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: verification-${{ github.run_id }}-${{ github.run_attempt }}
          # These directories hold reports/logs and screenshots of the authored
          # probe only. SDKs, installed runtimes and private games are not inputs.
          path: |
            evidence/
            local/screenshots/
          if-no-files-found: warn
          include-hidden-files: false
          retention-days: 14
