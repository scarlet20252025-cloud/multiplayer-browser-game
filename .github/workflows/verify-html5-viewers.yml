name: Verify HTML5 frozen native viewers

on:
  push:
    branches: ['work/flash-netplay-lab']
    paths:
      - 'adapters/fireboy-html5/spectator-*.mjs'
      - 'server/html5-research-room.mjs'
      - 'server/html5-room-core.mjs'
      - 'adapters/fireboy-html5/state-snapshot.mjs'
      - 'tests/html5-snapshot.test.mjs'
      - 'tests/html5-spectator-projection.test.mjs'
      - 'scripts/html5-research-host.mjs'
      - 'scripts/verify-html5-viewers.mjs'
      - '.github/workflows/verify-html5-viewers.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  viewers:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - name: Check out authored code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Node 24
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          cache: npm
      - name: Install locked dependencies
        run: npm ci
      - name: Test authored spectator and input modules
        run: npm test
      - name: Install Chromium
        run: npx playwright install --with-deps chromium-headless-shell
      - name: Fetch private runtime of pinned research candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: 1224HuangJin/Fireboy-and-Watergirl
          ref: 8568034556f567b5c429c0223dc1bf6dd2409277
          path: local/html5-candidate
          sparse-checkout: output/A
          persist-credentials: false
      - name: Two browser spectators apply one original game authority
        run: >-
          node scripts/verify-html5-viewers.mjs
          --root local/html5-candidate/output/A
          --script js/init.eb02fbdab2aa1d24.js
          --expected-sha256 337125629748bace45e23b040e54b0d206e4cd78c9c8709d7785faa637e00677
          --out local/html5-viewer-results
      - name: Save only authored observations
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: html5-frozen-viewer-observations
          path: local/html5-viewer-results/*.json
          if-no-files-found: warn
          retention-days: 14
