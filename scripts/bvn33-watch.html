<!doctype html>
<html lang="zh-CN">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>死神 vs 火影 3.3 · 观战</title>
<style>
  :root {color-scheme: light; font: 16px 'Microsoft YaHei UI', system-ui, sans-serif; background: linear-gradient(155deg,#b9e8ff,#e0f0ff 43%,#eee5ff); color: #20215c; min-height: 100%}
  * {box-sizing: border-box}
  body {margin: 0}
  main {width: min(960px,calc(100% - 20px),calc(max(270px,100dvh - 130px) * 4 / 3)); margin: 14px auto; padding-bottom: 14px}
  header {display: flex; gap: 8px; align-items: center; justify-content: space-between; margin-bottom: 10px; padding: 8px 12px; background: #fff; border: 1px solid #dcd8f3; border-radius: 16px; box-shadow: 0 3px 0 #a89bd743}
  h1 {margin: 0; font-size: clamp(16px, 4vw, 24px)}
  button {padding: 6px 10px; min-height: 42px; white-space: nowrap; color: #573400; background: #ffda4f; border: 1px solid #ffda4f; border-radius: 11px; font: 700 13px system-ui,sans-serif; cursor: pointer; box-shadow: 0 2px 0 #e5ad19}
  button:hover {background: #ffe883}
  button:focus-visible {outline: 2px solid #783af0; outline-offset: 2px}
  section {position: relative; background: #080518; aspect-ratio: 4 / 3; border: 3px solid #fff; border-radius: 16px; box-shadow: 0 0 0 1px #cabbe6; overflow: hidden}
  canvas {display: block; width: 100%; height: 100%}
  #fight-emotes {position: absolute; inset: 0; z-index: 1; pointer-events: none}
  #fight-emotes > div {position: absolute; top: clamp(5px, 2.8%, 18px); width: min(24%, 156px)}
  #fight-emote-p1 {left: clamp(5px, 2.2%, 18px)}
  #fight-emote-p2 {right: clamp(5px, 2.2%, 18px)}
  .fight-emote {display: block; width: 100%; height: auto; aspect-ratio: 1; object-fit: contain; border-radius: 12px}
  p {position: absolute; inset: 0; display: grid; place-content: center; margin: 0; padding: 12px; color: #fff; text-align: center; background: #221844ed}
  #status {z-index: 2}
  [hidden] {display: none}
</style>
<main>
  <header><h1>死神 vs 火影 3.3 · 观战</h1><button type="button" id="return">返回大厅</button></header>
  <section aria-label="对局画面">
    <canvas id="field" width="384" height="288"></canvas>
    <div id="fight-emotes" aria-hidden="true"><div id="fight-emote-p1"></div><div id="fight-emote-p2"></div></div>
    <p id="status" role="status">正在连接观战席位…</p>
  </section>
</main>
<script type="module" src="./lobby-watch.js"></script>
</html>
