<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>迷宫坦克</title>
  <style>
    [hidden]{display:none!important}
    body{margin:0;color:#20215c;font:16px "Microsoft YaHei UI",system-ui,sans-serif}
    #arena-entry{min-height:100vh;min-height:100dvh;display:grid;place-items:center;padding:20px;box-sizing:border-box;background:linear-gradient(155deg,#b9e8ff,#e0f0ff 43%,#eee5ff)}
    #arena-entry>div{width:min(100%,390px);box-sizing:border-box;padding:24px;background:#fff;border:2px solid #e5dbfe;border-radius:24px;box-shadow:0 6px 0 #a393d14d}
    #arena-entry h1{margin:0;font-size:25px}#arena-entry p{color:#5d5a83;line-height:1.5}
    #arena-entry button,#arena-entry a{display:inline-grid;place-items:center;min-height:42px;margin:4px 8px 0 0;padding:6px 11px;box-sizing:border-box;font:700 14px system-ui,sans-serif;color:#5f2cc4;text-decoration:none;background:#f3edff;border:1px solid #ddd0fe;border-radius:11px;cursor:pointer}
    #arena-entry button{color:#fff;background:#6731d4;border-color:#6731d4}
  </style>
</head>
<body>
  <section id="arena-entry" aria-labelledby="entry-title">
    <div><h1 id="entry-title">迷宫坦克</h1><p id="entry-status" role="status">正在载入对战界面…</p><button id="entry-retry" type="button" hidden>重新加载</button><a id="entry-return" href="/">返回房间</a></div>
  </section>
  <main class="arena-page" id="arena-page" hidden>
    <header class="game-bar">
      <div class="heading"><h1>迷宫坦克</h1><p id="room-label" hidden></p></div>
      <nav class="room-actions" aria-label="游戏操作">
        <button id="sound" type="button" aria-pressed="true">音效</button>
        <a id="return" href="/">返回房间</a>
      </nav>
    </header>
    <div class="battle-layout">
      <aside class="battle-side left" aria-label="玩家状态和模式">
        <div class="roster" id="roster-left"></div>
        <section class="side-panel mode-panel" aria-labelledby="modes-title">
          <div class="panel-heading"><h2 id="modes-title">模式投票</h2><span id="vote-threshold"></span></div>
          <div class="mode-options" id="mode-options"></div>
          <p id="vote-note">在线玩家过半后开启新赛局，比分归零。</p>
        </section>
      </aside>
      <section class="battle-center" aria-label="对局">
        <div class="scoreboard" aria-label="实时比分和连接状态">
          <div class="match-heading">
            <strong id="mode-title">迷宫对战</strong><span id="round"></span>
            <span class="latency-indicator" title="浏览器与对局服务器的往返延迟">延迟 <strong id="latency">连接中</strong></span>
          </div>
          <ol class="scores" id="scores"></ol>
        </div>
        <div class="board" aria-label="坦克战场">
          <canvas id="field" width="960" height="600" aria-label="随机迷宫坦克战场"></canvas>
          <div class="board-top"><span id="map-name">正在载入战场</span><time id="clock" hidden></time></div>
          <div class="respawn-hint" id="respawn-hint" role="status" hidden></div>
          <div class="overlay" id="overlay"><div class="overlay-card">
            <p id="overlay-note">对局连接</p><h2 id="overlay-title" role="status">正在建立连接</h2>
            <p id="overlay-detail" hidden></p>
            <div id="overlay-actions" class="overlay-actions" hidden><button id="match-retry" type="button">重试连接</button><a id="match-return" href="/">返回房间</a></div>
          </div></div>
        </div>
        <footer class="controls" aria-label="按键">
          <span><kbd>W</kbd> <kbd>S</kbd> 前进 / 后退</span>
          <span><kbd>A</kbd> <kbd>D</kbd> 左转 / 右转</span>
          <span><kbd>空格</kbd> 朝车头开火</span>
          <span id="guide-hint" hidden>遥控导弹飞行中，<kbd>A</kbd> <kbd>D</kbd> 调整方向</span>
        </footer>
        <details class="stats-panel" open>
          <summary>得分统计</summary>
          <div class="stats-scroll">
            <table class="stats-table" aria-label="本场房间累计得分统计">
              <thead><tr><th scope="col">玩家</th><th scope="col">累计得分</th><th scope="col">击毁</th><th scope="col">被击毁</th><th scope="col">胜局</th></tr></thead>
              <tbody id="match-stats"></tbody>
            </table>
          </div>
        </details>
      </section>
      <aside class="battle-side right" aria-label="玩家状态和补给">
        <div class="roster" id="roster-right"></div>
        <div id="match-reactions"></div>
        <details class="side-panel supply-help">
          <summary>补给与反弹</summary>
          <p>靠近补给箱拾取。炮弹反弹后可能击中自己。</p>
          <dl id="supply-list"></dl>
        </details>
      </aside>
    </div>
  </main>
  <template id="player-card">
    <section class="player-card">
      <div class="player-heading"><span class="seat-label"></span><h2>等待玩家</h2><small class="you" hidden>你</small></div>
      <dl>
        <div><dt>连接</dt><dd class="connection">等待连接</dd></div>
        <div><dt>战况</dt><dd class="condition">待命</dd></div>
        <div><dt>护甲</dt><dd class="armor">无</dd></div>
        <div><dt>武器</dt><dd class="supply">标准炮</dd></div>
      </dl>
    </section>
  </template>
  <script>
    (() => {
      const entry = document.getElementById('arena-entry');
      const status = document.getElementById('entry-status');
      const retry = document.getElementById('entry-retry');
      const address = new URL(location.href);
      const attempt = Math.min(2, Math.max(0, parseInt(address.searchParams.get('arenaLoad') || '0', 10) || 0));
      const lobby = new URL('/', location.href);
      if (address.searchParams.has('room')) lobby.searchParams.set('room', address.searchParams.get('room'));
      document.getElementById('entry-return').href = lobby.href;
      retry.onclick = () => {
        const target = new URL(location.href);
        if (target.searchParams.has('arenaLoad')) {
          target.searchParams.delete('arenaLoad');
          location.replace(target.href);
        } else location.reload();
      };

      function stylesheet(index) {
        return new Promise(resolve => {
          const link = document.createElement('link');
          link.rel = 'stylesheet';
          link.href = './arena.css' + (index ? '?retry=' + index : '');
          function finish(loaded) {
            clearTimeout(timer);
            link.onload = link.onerror = null;
            if (!loaded) link.remove();
            resolve(loaded);
          }
          link.onload = () => finish(true);
          link.onerror = () => finish(false);
          const timer = setTimeout(() => finish(false), 4200);
          document.head.append(link);
        });
      }

      async function begin() {
        for (let index = 0;; index++) {
          if (index || attempt) status.textContent = '正在重新载入对战界面…';
          if (await stylesheet(index)) break;
          if (index === 2) {
            status.textContent = '暂时无法载入界面，可保留席位重新加载。';
            retry.hidden = false;
            return;
          }
          await new Promise(resolve => setTimeout(resolve, 400 * (index + 1)));
        }
        let active = true;
        window.arenaEntryActive = () => active;
        let timer;
        try {
          await Promise.race([import('./arena.mjs'), new Promise((_, reject) => {
            timer = setTimeout(() => reject(Error('Module timeout')), 6500);
          })]);
          document.getElementById('arena-page').hidden = false;
          entry.hidden = true;
          const target = new URL(location.href);
          if (target.searchParams.has('arenaLoad')) {
            target.searchParams.delete('arenaLoad');
            history.replaceState(null, '', target.href);
          }
        } catch {
          active = false;
          if (attempt < 2) {
            status.textContent = '联机组件暂时不可用，正在重新加载…';
            setTimeout(() => {
              const target = new URL(location.href);
              target.searchParams.set('arenaLoad', String(attempt + 1));
              location.replace(target.href);
            }, 450 * (attempt + 1));
          } else {
            status.textContent = '联机组件暂时无法载入，可保留席位重新加载。';
            retry.hidden = false;
          }
        } finally {
          clearTimeout(timer);
        }
      }
      void begin();
    })();
  </script>
  <script type="module" src="/__lobby__/game-chat.mjs"></script>
</body>
</html>
